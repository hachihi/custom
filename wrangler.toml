name = "order-portal"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Giao diện tĩnh nằm trong public/. Chỉ /api/* chạy qua Worker, còn lại phục vụ thẳng file tĩnh.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "a2447b3e-c351-4f0d-bf70-d4e0750c0272"
migrations_dir = "migrations"

# Dọn session/bộ đếm hết hạn và log cũ mỗi ngày lúc 03:17 giờ Việt Nam (20:17 UTC)
[triggers]
crons = ["17 20 * * *"]

[vars]
# ---- Đăng nhập Google (bắt buộc): OAuth Client ID loại "Web application" ----
GOOGLE_CLIENT_ID = ""

# ---- Odoo 14 (ODOO_API_KEY là secret: wrangler secret put ODOO_API_KEY) ----
ODOO_URL = "https://erp.hangchinhhieu.vn"
ODOO_DB = "DB_HCH_PRO_V2_2023072023"
ODOO_USER = "hai.hoang@hangchinhhieu.vn"
# self = chỉ thấy đơn của chính liên hệ ; commercial = thấy đơn của cả công ty
ORDER_SCOPE = "self"
# Model ticket (Odoo Enterprise Helpdesk). Để chuỗi rỗng "" nếu không dùng ticket
TICKET_MODEL = "helpdesk.ticket"

# ---- Phiên ghi nhớ đăng nhập ----
SESSION_TTL_HOURS = "72"

# ---- Nhật ký (D1) ----
LOG_RETENTION_DAYS = "90"
# "1" = ghi cả lượt xem chi tiết đơn/ticket ; "0" = chỉ ghi sự kiện đăng nhập
LOG_VIEWS = "1"

# Secrets cần đặt:  wrangler secret put ODOO_API_KEY
